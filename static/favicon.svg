<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0F0F0F"/>

  <!-- N — x: 2 to 13, width=11 -->
  <!-- Left vertical bar -->
  <line x1="3.1" y1="8" x2="3.1" y2="24" stroke="#F5F5F5" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Diagonal stroke -->
  <line x1="3.1" y1="8" x2="12" y2="24" stroke="#F5F5F5" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right vertical bar -->
  <line x1="12" y1="8" x2="12" y2="24" stroke="#F5F5F5" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Divider dot -->
  <circle cx="16" cy="16" r="1.3" fill="#4F8EF7"/>

  <!-- W — x: 19 to 30, width=11 -->
  <!-- Left vertical -->
  <line x1="19.1" y1="8" x2="19.1" y2="24" stroke="#F5F5F5" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Left diagonal down to center -->
  <line x1="19.1" y1="24" x2="24.5" y2="14" stroke="#F5F5F5" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right diagonal up from center -->
  <line x1="24.5" y1="14" x2="29.9" y2="24" stroke="#F5F5F5" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right vertical -->
  <line x1="29.9" y1="8" x2="29.9" y2="24" stroke="#F5F5F5" stroke-width="2.2" stroke-linecap="round"/>
</svg>
